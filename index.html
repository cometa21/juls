        var secure = location.protocol === "https:" ? "; Secure" : "";

        document.cookie =
          encodeURIComponent(CONFIG.prefix + name) + "=" + encodeURIComponent(value) +
          expires + "; path=/" + domainPart + sameSite + secure;
      } catch (e) {}
    }

    function getCookie(name) {
      try {
        var key = encodeURIComponent(CONFIG.prefix + name) + "=";
        var parts = document.cookie ? document.cookie.split(";") : [];
        for (var i = 0; i < parts.length; i++) {
          var c = parts[i].trim();
          if (c.indexOf(key) === 0) {
            return decodeURIComponent(c.substring(key.length));
          }
        }
      } catch (e) {}
      return null;
    }

    function deleteCookie(name) {
      setCookie(name, "", -1);
    }

    /* ============================================================
       3. IDENTIFICADORES
       ============================================================ */
    function uuid() {
      try {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
      } catch (e) {}
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
        var r = (Math.random() * 16) | 0;
        var v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    var visitorId = getCookie("vid");
    var isNewVisitor = false;
    if (!visitorId) {
      visitorId = uuid();
      isNewVisitor = true;
      setCookie("vid", visitorId, CONFIG.visitorDays);
      setCookie("first_visit", new Date().toISOString(), CONFIG.visitorDays);
      setCookie("visits", "1", CONFIG.visitorDays);
    } else if (!getCookie("visits")) {
      setCookie("visits", "2", CONFIG.visitorDays);
    }

    var sessionId = getCookie("sid");
    var isNewSession = false;
    if (!sessionId) {
      sessionId = uuid();
      isNewSession = true;
      setCookie("sid", sessionId, null, { sameSite: "Lax" });
    }

    setCookie("last_seen", new Date().toISOString(), CONFIG.visitorDays);

    /* ============================================================
       4. ALMACÉN LOCAL (buffer de eventos)
       ============================================================ */
    var STORE_KEY = CONFIG.prefix + "events";

    function localEvents() {
      try {
        return JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      } catch (e) { return []; }
    }

    function saveLocal(events) {
      try {
        localStorage.setItem(
          STORE_KEY,
          JSON.stringify(events.slice(-CONFIG.maxLocalEvents))
        );
      } catch (e) {}
    }

    /* ============================================================
       5. MOTOR DE EVENTOS
       ============================================================ */
    function track(eventName, data) {
      if (!hasConsent()) return null;

      var payload = {
        event: eventName,
        ts: new Date().toISOString(),
        visitor_id: visitorId,
        session_id: sessionId,
        new_visitor: isNewVisitor,
        new_session: isNewSession,
        visits: parseInt(getCookie("visits") || "1", 10),
        url: location.href,
        path: location.pathname,
        referrer: document.referrer || null,
        title: document.title,
        screen: window.screen ? (window.screen.width + "x" + window.screen.height) : null,
        viewport: window.innerWidth + "x" + window.innerHeight,
        language: navigator.language || null,
        timezone: (function () {
          try { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
          catch (e) { return null; }
        })(),
        data: data || {}
      };

      var evts = localEvents();
      evts.push(payload);
      saveLocal(evts);

      if (CONFIG.endpoint) send(payload);
      return payload;
    }

    function send(payload) {
      var body = JSON.stringify(payload);
      try {
        if (navigator.sendBeacon) {
          navigator.sendBeacon(
            CONFIG.endpoint,
            new Blob([body], { type: "application/json" })
          );
        } else {
          fetch(CONFIG.endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: body,
            keepalive: true
          });
        }
      } catch (e) {}
    }

    /* ============================================================
       6. CONSENTIMIENTO (opcional)
       ============================================================ */
    function hasConsent() {
      if (!CONFIG.requireConsent) return true;
      return getCookie("consent") === "granted";
    }

    function showConsentBanner() {
      var bar = document.createElement("div");
      bar.id = "tracking-consent";
      bar.setAttribute("style", [
        "position:fixed", "left:12px", "right:12px", "bottom:12px", "z-index:9999",
        "background:#121212", "color:#fff", "border-radius:14px", "padding:14px 16px",
        "display:flex", "flex-wrap:wrap", "gap:10px", "align-items:center",
        "justify-content:space-between",
        "font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace",
        "box-shadow:0 6px 18px rgba(0,0,0,.18)"
      ].join(";"));

      var txt = document.createElement("span");
      txt.textContent = "Usamos cookies para medir el uso de la herramienta y mejorar la experiencia.";

      var btnBox = document.createElement("span");
      btnBox.setAttribute("style", "display:flex;gap:8px");

      var accept = document.createElement("button");
      accept.textContent = "Aceptar";
      accept.setAttribute("style",
        "background:#ff5a1f;color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:700");

      var reject = document.createElement("button");
      reject.textContent = "Rechazar";
      reject.setAttribute("style",
        "background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit");

      accept.onclick = function () {
        setCookie("consent", "granted", CONFIG.visitorDays);
        bar.remove();
        init();
      };
      reject.onclick = function () {
        setCookie("consent", "denied", CONFIG.visitorDays);
        bar.remove();
      };

      btnBox.appendChild(accept);
      btnBox.appendChild(reject);
      bar.appendChild(txt);
      bar.appendChild(btnBox);
      document.body.appendChild(bar);
    }

    /* ============================================================
       7. RECOLECCIÓN AUTOMÁTICA
       ============================================================ */
    var started = false;

    function init() {
      if (started) return;
      started = true;

      track("page_view");

      var maxScroll = 0;
      var startTime = Date.now();
      var flushed = false;

      window.addEventListener("scroll", function () {
        var h = document.documentElement.scrollHeight - window.innerHeight;
        var pct = h > 0 ? Math.round((window.scrollY / h) * 100) : 100;
        if (pct > maxScroll) maxScroll = pct;
      }, { passive: true });

      function flushEngagement() {
        if (flushed) return;
        flushed = true;
        track("engagement", {
          seconds: Math.round((Date.now() - startTime) / 1000),
          max_scroll_pct: maxScroll
        });
      }

      window.addEventListener("pagehide", flushEngagement);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") flushEngagement();
      });

      document.addEventListener("click", function (e) {
        var el = e.target && e.target.closest
          ? e.target.closest("button, a, [role=button], input[type=submit]")
          : null;
        if (!el) return;

        var label = (el.innerText || el.value || "").trim().slice(0, 80);
        track("click", {
          tag: el.tagName.toLowerCase(),
          text: label,
          href: el.getAttribute ? el.getAttribute("href") : null,
          id: el.id || null
        });

        if (label.toLowerCase().indexOf("procesar") !== -1) {
          var ta = document.querySelector("textarea");
          var lines = ta
            ? ta.value.split("\n").filter(function (l) { return l.trim(); }).length
            : 0;
          track("list_processed", { lines: lines });
        }

        if (/exportar|descargar/i.test(label)) {
          track("export", { label: label });
        }
      }, true);

      document.addEventListener("change", function (e) {
        var el = e.target;
        if (!el || !el.tagName) return;

        var tag = el.tagName.toLowerCase();
        if (tag !== "input" && tag !== "select" && tag !== "textarea") return;

        var type = (el.getAttribute("type") || "").toLowerCase();
        if (["password", "email", "tel"].indexOf(type) !== -1) return;

        track("field_change", {
          tag: tag,
          type: type || null,
          name: el.name || el.id || null,
          value: String(el.value || "").slice(0, 120)
        });
      }, true);

      document.addEventListener("change", function (e) {
        var el = e.target;
        if (!el || el.type !== "file" || !el.files) return;
        track("file_upload", {
          count: el.files.length,
          files: Array.prototype.map.call(el.files, function (f) {
            return { name: f.name, size: f.size, type: f.type };
          })
        });
      }, true);

      document.addEventListener("click", function (e) {
        var el = e.target && e.target.closest ? e.target.closest("button") : null;
        if (!el) return;
        var t = (el.innerText || "").trim();
        if (/^(20|30|40|50)×/.test(t) || /^\d+×\d+/.test(t)) {
          track("label_size_selected", { size: t.slice(0, 40) });
        }
      }, true);

      window.addEventListener("error", function (e) {
        track("js_error", {
          message: e.message || null,
          source: e.filename || null,
          line: e.lineno || null
        });
      });

      window.addEventListener("unhandledrejection", function (e) {
        track("promise_rejection", {
          reason: e.reason && e.reason.message ? e.reason.message : String(e.reason)
        });
      });
    }

    /* ============================================================
       8. API PÚBLICA
       ============================================================ */
    window.Tracking = {
      track: track,
      visitorId: function () { return visitorId; },
      sessionId: function () { return sessionId; },
      getEvents: localEvents,
      clearEvents: function () {
        try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      },
      exportEvents: function () {
        var blob = new Blob([JSON.stringify(localEvents(), null, 2)], {
          type: "application/json"
        });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "tracking-events.json";
        a.click();
        URL.revokeObjectURL(url);
      },
      optOut: function () {
        ["vid", "sid", "visits", "first_visit", "last_seen", "consent"]
          .forEach(deleteCookie);
        try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      },
      config: CONFIG
    };

    /* ============================================================
       9. ARRANQUE
       ============================================================ */
    function boot() {
      if (hasConsent()) {
        init();
      } else {
        showConsentBanner();
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
